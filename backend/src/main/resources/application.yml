# 默认高位端口，减少与常见 8080/8081/8082 冲突；可用环境变量 SERVER_PORT 覆盖
server:
  port: ${SERVER_PORT:28480}

spring:
  application:
    name: operator-backend
  profiles:
    # 未指定 --spring.profiles.active 时使用本地组合（含 nomq，无 Rabbit 自动配置）
    default:
      - local
    group:
      # 本地开发：含 nomq（排除 Rabbit 自动配置），见 application-local.yml
      local:
        - nomq
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/financial_trading?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:lyb050527}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        auto-startup: ${FINANCIAL_MESSAGING_ENABLED:true}
        prefetch: 16
        concurrency: 1

financial:
  # 独立模拟交易所（见 mock-exchange 模块）。设 base-url 后，委托报盘受理由该进程写回报；留空则保持原进程内受理。
  mock-exchange:
    base-url: ${MOCK_EXCHANGE_BASE_URL:}
    shared-secret: ${MOCK_EXCHANGE_SHARED_SECRET:}
  messaging:
    enabled: ${FINANCIAL_MESSAGING_ENABLED:true}
  ratelimit:
    # 同一 IP 每分钟允许发起的「下单」POST 次数（网关另有全局限流）
    orders-per-minute-per-ip: ${RATE_LIMIT_ORDERS_PER_MIN:120}
  gateway:
    # 由网关转发时，可信任该头作为客户端 IP（网关需设置）
    client-ip-header: X-Forwarded-For
